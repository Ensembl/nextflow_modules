# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: CMSCAN
description: Search genome FASTA chunks against an Rfam covariance model database with Infernal cmscan.
keywords:
  - infernal
  - cmscan
  - rfam
  - covariance model
tools:
  - infernal:
      description: Infernal RNA homology search and alignment tools.
      homepage: http://eddylab.org/infernal/
      documentation: http://eddylab.org/infernal/
      licence: ["BSD-3-Clause"]

authors:
  - "@ensembl-dev"
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, including a unique id.
    - chunk:
        type: file
        description: FASTA chunk to scan.
        pattern: "*.{fa,fasta,fna}"
    - rfam_filtered_cm:
        type: file
        description: Rfam covariance model database used for scanning.
        pattern: "*.cm{,.gz}"
output:
  tblout:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "*.tblout":
          type: file
          description: Tabular cmscan hits for the input chunk.
          pattern: "*.tblout"

topics:
  versions:
    - - cmscan:
          type: string
          description: The name of the tool.
      - ? cmscan --version 2>/dev/null || echo unknown
        : type: eval
          description: The expression to obtain the version of the tool.
