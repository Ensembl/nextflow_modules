name: manifest_maker
description: Generate a manifest and validate its JSON schema using provided input
  files and metadata.
keywords:
- ensembl
- genomics
- genomio
- integrity
- validation
tools:
- manifest_maker:
    description: Nextflow modules for genomic data file manifest comparison/checking.
    homepage: https://github.com/Ensembl/nextflow_modules
    licence:
    - Apache License version 2.0
input:
- - meta:
      type: map
      description: 'Groovy Map containing meta information

        e.g. `[ accession:''accession01'' ]`

        '
  - file_name:
      type: file
      description: Channel element file_name.
output:
  output:
  - - meta:
        type: map
        description: 'Groovy Map containing meta information

          e.g. `[ accession:''accession1'' ]`

          '
    - '*.{gff3,fasta,json}':
        type: file
        description: Channel element *.{gff3,fasta,json}.
        pattern: '*.{gff3,fasta,json}'
  versions:
  - versions.yml:
      type: file
      description: File containing information on module software version
      pattern: versions.yml
authors:
- ensembl-dev@ebi.ac.uk
maintainers:
- ensembl-dev@ebi.ac.uk
