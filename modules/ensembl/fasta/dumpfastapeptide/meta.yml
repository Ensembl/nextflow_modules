name: fasta_dumpfastapeptide
description: A module for dumping peptide FASTA sequences from core databases
keywords:
- container
- database
- docker
- ensembl-genomio
- ensembl-legacy-scripts
- fasta
tools:
- fasta:
    description: Modules which function to facilitate data deposition/retrieval of
      fasta sequences.
    homepage: https://github.com/Ensembl/nextflow_modules
    licence:
    - Apache License version 2.0
input:
- db:
    type: map
    description: 'A meta map including the core database name.

      Example: [[ db:''genus_species_gca00000000v1_core_110_1'', species:''Genus species'',
      ...]]

      '
    pattern: '[a-z]+_[a-z]_gc[af][0-9]v[0-9]+_core_*'
output:
  peptide_fasta:
  - - db:
        type: map
        description: 'FASTA file containing peptide sequence(s).

          Example: [ db:''database name'', file("*_fasta_pep.fasta") ]

          '
        pattern: '*_fasta_pep.fasta'
    - fasta_pep:
        type: string
        description: 'FASTA file containing peptide sequence(s).

          Example: [ db:''database name'', file("*_fasta_pep.fasta") ]

          '
        pattern: '*_fasta_pep.fasta'
    - '*.fasta':
        type: file
        description: 'FASTA file containing peptide sequence(s).

          Example: [ db:''database name'', file("*_fasta_pep.fasta") ]

          '
        pattern: '*_fasta_pep.fasta'
  versions:
  - versions.yml:
      type: file
      description: File containing information on module software version
      pattern: versions.yml
authors:
- ensembl-dev@ebi.ac.uk
maintainers:
- ensembl-dev@ebi.ac.uk
