name: dump_genomestats
description: A module for dumping a core database
keywords:
- container
- core_database
- docker
- ensembl-genomio
- json
tools:
- dump:
    description: Modules which function to dump various forms of data from a core
      database.
    homepage: https://github.com/Ensembl/nextflow_modules
    licence:
    - Apache License version 2.0
input:
- db:
    type: map
    description: 'A meta map including the core database name.

      Example: [[ db:''genus_species_gca00000000v1_core_110_1'', species:''Genus species'',
      ...]]

      '
    pattern: '[a-z]+_[a-z]_gc[af][0-9]v[0-9]+_core_*'
output:
  core_stats:
  - - db:
        type: map
        description: 'JSON file containing core database statistics (assembly and
          annotation).

          Example: [ db:"database name", file("core_stats.json") ]

          '
        pattern: core_stats.json
    - core_stats.json:
        type: file
        description: 'JSON file containing core database statistics (assembly and
          annotation).

          Example: [ db:"database name", file("core_stats.json") ]

          '
        pattern: core_stats.json
  versions:
  - versions.yml:
      type: file
      description: File containing information on module software version
      pattern: versions.yml
authors:
- ensembl-dev@ebi.ac.uk
maintainers:
- ensembl-dev@ebi.ac.uk
