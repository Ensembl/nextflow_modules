name: database_dbfactory
description: Generate a list of one or more databases plus some associated meta table
  information.
keywords:
- container
- core_database
- docker
- database
- ensembl-genomio
tools:
- database:
    description: Modules which function to read or write information from core databases.
    homepage: https://github.com/Ensembl/nextflow_modules
    licence:
    - Apache License version 2.0
input:
- - server:
      type: map
      description: 'Groovy Map containing MySQL server host, port, user and password

        metadata, plus the JSON database filter information.

        Example: [[ host:"mysql-host-test-prod" ], [ filter_map:"dbrename_re" ]]

        '
  - filter_map:
      type: map
      description: Channel element filter_map.
output:
  dbs_meta_json:
  - dbs.json:
      type: file
      description: JSON file containing database metadata.
      pattern: dbs.json
  versions:
  - versions.yml:
      type: file
      description: File containing information on module software version
      pattern: versions.yml
authors:
- ensembl-dev@ebi.ac.uk
maintainers:
- ensembl-dev@ebi.ac.uk
