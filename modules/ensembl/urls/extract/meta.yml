name: URLS_EXTRACT
description: Extracts MySQL arguments from a URL string
keywords:
- url
- mysql
- parse
tools:
- urls:
    description: Extract connection parameters from a MySQL URL.
    homepage: https://github.com/Ensembl/nextflow_modules
input:
- - meta:
      type: map
      description: 'Groovy Map containing sample information

        e.g. [ id:''test'', single_end:false ]

        '
  - url_string:
      type: string
      description: MySQL URL string to parse
output:
  connection_info:
  - - meta:
        type: map
        description: 'Groovy Map containing sample information

          e.g. [ id:''test'', single_end:false ]

          '
    - user:
        type: string
        description: Extracted username from the URL
    - host:
        type: string
        description: Extracted host from the URL
    - port:
        type: string
        description: Extracted port from the URL
    - password:
        type: string
        description: Extracted password from the URL (if present)
    - database:
        type: string
        description: Extracted database name from the URL (if present)
  versions:
  - versions.yml:
      type: file
      description: File containing software versions
      pattern: versions.yml
authors:
- '@ensembl-dev'
- '@Salome-Brunon'
maintainers:
- '@ensembl-dev'
