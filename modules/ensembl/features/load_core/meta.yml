name: "features_load_core"
description: Load feature JSON data into an Ensembl core database.
keywords:
  - ensembl
  - features
  - genomics
  - genomio
  - json
  - database
tools:
  - "features_core_load":
      description: "Load feature JSON data into an Ensembl core database."
      homepage: "https://github.com/Ensembl/ensembl-genomio"
      licence:
        - "Apache License version 2.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing meta information
          e.g. `[ id:'accession1' ]`
    - features_json:
        type: file
        description: JSON file containing feature data to load.
        pattern: "*.json"
        ontologies:
          - edam: "http://edamontology.org/format_3464" # JSON
    - prod_host:
        type: string
        description: Hostname of the production database.
    - prod_database:
        type: string
        description: Name of the production database.
    - prod_user:
        type: string
        description: Username for the production database.
    - prod_port:
        type: integer
        description: Port for the production database connection.
    - core_host:
        type: string
        description: Hostname of the target core database.
    - core_database:
        type: string
        description: Name of the target core database.
    - core_user:
        type: string
        description: Username for the target core database.
    - core_port:
        type: integer
        description: Port for the target core database connection.
output: {}
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process.
      - features_core_load:
          type: string
          description: The name of the tool.
      - "features_core_load --version 2>/dev/null || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool.
authors:
  - "ensembl-dev@ebi.ac.uk"
maintainers:
  - "ensembl-dev@ebi.ac.uk"
